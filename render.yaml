services:
  - type: web
    name: mark-six-pwa
    runtime: node
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y --no-install-recommends ffmpeg python3 python3-pip &&
      pip3 install --break-system-packages yt-dlp &&
      npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
    healthCheckPath: /
