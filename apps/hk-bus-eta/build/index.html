<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>巴士預報 · Bus ETA</title>
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="/bus-eta-lite/manifest.json">
<link rel="icon" href="/bus-eta-lite/img/logo192.png">
<link rel="apple-touch-icon" href="/bus-eta-lite/img/logo192.png">
<link rel="stylesheet" href="/bus-eta-lite/styles.css">
</head>
<body>
<header class="appbar">
  <div class="brand">
    <div class="brand-logo">巴</div>
    <h1>巴士預報</h1>
  </div>
  <div class="header-actions">
    <button id="langBtn" type="button" class="hbtn" title="Language">EN</button>
    <button id="refreshBtn" type="button" class="hbtn" title="刷新">↻</button>
  </div>
</header>

<nav class="tabs" id="tabBar">
  <button type="button" class="tab active" data-tab="route">路線查詢</button>
  <button type="button" class="tab" data-tab="stop">車站查詢</button>
</nav>

<main>
  <section id="viewHome" class="view">
    <div id="panelRoute" class="panel">
      <div class="search-wrap">
        <span class="search-icon">▣</span>
        <input id="routeInput" class="search-input" placeholder="輸入路線號碼，如 1A、286X、A12" autocomplete="off" spellcheck="false">
      </div>
      <div id="routeResults" class="results"></div>
    </div>
    <div id="panelStop" class="panel hidden">
      <div class="search-row">
        <div class="search-wrap">
          <span class="search-icon">◎</span>
          <input id="stopInput" class="search-input" placeholder="輸入車站名稱，如 怡和街" autocomplete="off" spellcheck="false">
        </div>
        <button id="nearBtn" type="button" class="near-btn">附近的站</button>
      </div>
      <div id="stopResults" class="results"></div>
    </div>
  </section>

  <section id="viewDetail" class="view hidden">
    <div id="detailTop"></div>
    <div id="detailContent"></div>
  </section>
</main>

<div id="statusbar"></div>
<div id="splash"><div class="splash-box"><div class="splash-spin"></div><div id="splashMsg">載入路線資料…</div></div></div>

<script type="module" src="/bus-eta-lite/app.js"></script>
</body>
</html>
