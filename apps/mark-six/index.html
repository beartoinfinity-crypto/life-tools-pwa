<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b71c1c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mark Six" />
  <meta name="description" content="Hong Kong Mark Six Lottery Results" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Mark Six Results</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-content">
      <svg class="ball-logo" viewBox="0 0 36 36" width="36" height="36">
        <circle cx="18" cy="18" r="16" fill="#fff" />
        <circle cx="18" cy="18" r="15" fill="#d32f2f" />
        <text x="18" y="24" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">6</text>
      </svg>
      <h1>Mark Six<span class="app-ver">v1.3 build 202609291058</span></h1>
      <button id="refreshBtn" class="refresh-btn" title="Refresh">
        <svg class="refresh-icon" viewBox="0 0 24 24" width="24" height="24">
          <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div id="statusBar" class="status-bar">
      <span id="lastUpdate">Loading...</span>
    </div>

    <section id="nextDrawPanel" class="next-draw" aria-labelledby="nextDrawHeading">
      <h2 id="nextDrawHeading" class="nd-heading">NEXT DRAW: <span id="ndDate" class="nd-date">--</span></h2>
      <div class="nd-row">
        <span class="nd-label">Sales Cutoff In:</span>
        <time id="ndCutoff" class="nd-countdown" datetime="">--</time>
      </div>
    </section>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Fetching latest results...</p>
    </div>

    <div id="error" class="error" style="display:none;">
      <p id="errorMsg"></p>
      <button id="retryBtn" class="retry-btn">Retry</button>
    </div>

    <div id="results" class="results" style="display:none;"></div>

    <section id="statsPanel" class="panel" aria-labelledby="statsHeading" style="display:none;">
      <h2 id="statsHeading">Number frequency</h2>
      <div id="statsChips" class="stats-chips" role="group" aria-label="Stats window">
        <button type="button" class="stats-chip" data-w="20" aria-pressed="false">Last 20</button>
        <button type="button" class="stats-chip active" data-w="50" aria-pressed="true">Last 50</button>
        <button type="button" class="stats-chip" data-w="100" aria-pressed="false">Last 100</button>
      </div>
      <div class="stats-block">
        <h3>Hot numbers</h3>
        <div id="hotNums" class="stats-balls"></div>
      </div>
      <div class="stats-block">
        <h3>Cold numbers</h3>
        <div id="coldNums" class="stats-balls"></div>
      </div>
      <div class="stats-block">
        <h3>Odd / Even</h3>
        <div id="oeBar" class="oe-bar" role="img" aria-label=""></div>
        <div id="oeLegend" class="oe-legend"></div>
      </div>
      <p class="stats-note">Hot counts are appearances; cold counts are draws since last drawn ( &gt; means not in the fetched history ).</p>
    </section>

    <section id="ticketPanel" class="panel" aria-labelledby="ticketHeading">
      <h2 id="ticketHeading">Check your ticket</h2>
      <div class="ticket-form">
        <label for="ticketInput" class="sr-only">Your 6 numbers, 1-49</label>
        <input id="ticketInput" class="ticket-input" type="text" inputmode="numeric" autocomplete="off"
          placeholder="e.g. 3 7 11 15 33 46" aria-describedby="ticketError" />
        <button id="saveTicketBtn" class="save-ticket-btn" type="button">Save &amp; check</button>
      </div>
      <p id="ticketError" class="ticket-error" role="alert" hidden></p>
      <div id="ticketList" class="ticket-list"></div>
    </section>

    <div id="loadOlderWrap" class="load-older-wrap" style="display:none;">
      <button id="loadOlderBtn" class="load-older-btn">Load Older Results</button>
      <div id="olderSpinner" class="older-spinner" style="display:none;"></div>
      <span id="olderStatus" class="older-status"></span>
    </div>
  </main>


  <script src="app.js"></script>
</body>
</html>
