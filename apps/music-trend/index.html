<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7b1fa2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Music Trend" />
  <meta name="description" content="Hong Kong Apple Music top charts — trending, Cantonese and Mandarin playlists" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <title>Music Trend 樂壇趨勢</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-content">
      <svg class="logo" viewBox="0 0 36 36" width="36" height="36" aria-hidden="true">
        <rect x="2" y="2" width="32" height="32" rx="8" fill="#7b1fa2" />
        <text x="18" y="25" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">樂</text>
      </svg>
      <h1>樂壇趨勢<span class="app-ver">v1.0 build 202609210730</span></h1>
      <button id="refreshBtn" class="refresh-btn" title="Refresh">
        <svg class="refresh-icon" viewBox="0 0 24 24" width="24" height="24">
          <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div id="statusBar" class="status-bar">
      <span id="lastUpdate">Loading...</span>
    </div>

    <div class="country-tabs" id="countryTabs"></div>

    <div class="tabs" id="listTabs">
      <button class="tab active" data-list="trending">熱門趨勢</button>
      <button class="tab" data-list="cantonese">廣東歌</button>
      <button class="tab" data-list="chinese">國語歌</button>
      <button class="tab" data-list="my">我的歌單</button>
    </div>

    <div id="myTools" class="my-tools hidden">
      <button id="myUploadBtn" class="my-tool-btn">⇧ 上傳歌單</button>
      <button id="myPickerBtn" class="my-tool-btn">⇩ 下載歌單</button>
      <button id="myImportBtn" class="my-tool-btn">＋ 匯入歌單</button>
    </div>
    <div id="myPicker" class="my-picker hidden"></div>
    <div id="myImport" class="my-picker hidden"></div>

    <div id="playList" class="song-list">
      <div class="loading-note">Loading playlists…</div>
    </div>

    <a class="src-link" href="https://music.apple.com/hk/playlist" target="_blank" rel="noopener">Source: Apple Music HK Top 100 &rarr;</a>
  </main>

  <div id="playerBar" class="player-bar hidden">
    <div id="playerMount" class="player-mount"><div id="ytFrame"></div></div>
    <div class="p-bar-row">
      <div class="p-info">
        <div id="nowName" class="p-name">—</div>
        <div id="nowArtist" class="p-artist">—</div>
        <span id="pTime" class="p-time">0:00 / --:--</span>
      </div>
      <div class="p-controls">
        <button id="shuffleBtn" class="p-btn p-shuffle" title="Random: off">
          <svg class="shuffle-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" fill="currentColor"/>
          </svg>
        </button>
        <button id="prevBtn" class="p-btn" title="Previous">&#8678;</button>
        <button id="playPauseBtn" class="p-btn p-main" title="Play/Pause">&#9654;</button>
        <button id="nextBtn" class="p-btn" title="Next">&#8680;</button>
        <button id="videoBtn" class="p-btn" title="Show video">&#9654;&#9654;</button>
        <button id="closeBtn" class="p-btn p-close" title="Close">&#10005;</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
