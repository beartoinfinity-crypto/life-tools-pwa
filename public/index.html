<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#263238" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Life Tool" />
  <meta name="description" content="Life Tool - a collection of handy web apps" />
  <title>Life Tool</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml" href="icon-light.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="icon-dark.svg" media="(prefers-color-scheme: dark)" />
</head>
<body>
  <header>
    <div class="header-content">
      <svg class="logo" viewBox="0 0 36 36" width="36" height="36" aria-hidden="true">
        <rect x="4" y="4" width="14" height="14" rx="3" fill="#4caf50" />
        <rect x="18" y="4" width="14" height="14" rx="3" fill="#ffb300" />
        <rect x="4" y="18" width="14" height="14" rx="3" fill="#2196f3" />
        <rect x="18" y="18" width="14" height="14" rx="3" fill="#f44336" />
      </svg>
      <h1>Life Tool</h1>
    </div>
  </header>

  <main>
    <p class="tagline">A collection of handy web apps</p>
    <section id="appGrid" class="app-grid" aria-label="Apps"></section>
  </main>

  <footer>Life Tool &middot; 2026</footer>

  <script src="app.js"></script>
</body>
</html>
